<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grid Layout</title>
    <link rel="stylesheet" href="layout.css">
</head>
<body>
    <header class="header el">
        <h1>Header</h1>
    </header>
    <main class="container el">
        <div class="box">1. Hello!</div>
        <div class="box">2. How u doin?</div>
        <div class="box">3. Go to the gym</div>
        <div class="box">4. Read Books</div>
        <div class="box" title="Watch a movie">5. Watch a movie</div>
        <div class="box">6. Sleep early</div>
      
    </main>
    <aside class="sidebar el">
        <h2>Sidebar</h2>
    </aside>
    <footer class="footer el">
        <h2>Footer</h2>
    </footer>
    
</body>
</html>
